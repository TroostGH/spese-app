<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g4bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="g4wal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="g4wal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="g4card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round4"><rect width="1024" height="1024" rx="224" ry="224"/></clipPath>
  </defs>
  <g clip-path="url(#round4)">
    <rect width="1024" height="1024" fill="url(#g4bg)"/>
    <ellipse cx="512" cy="-60" rx="640" ry="280" fill="#FFFFFF" opacity="0.18"/>
    <!-- back wallet body -->
    <g filter="url(#shadow4)">
      <rect x="200" y="380" width="624" height="380" rx="64" fill="url(#g4wal)"/>
    </g>
    <!-- cards peeking -->
    <rect x="320" y="338" width="220" height="160" rx="22" fill="url(#g4card)"/>
    <rect x="480" y="320" width="240" height="170" rx="22" fill="#FBBF24"/>
    <rect x="500" y="356" width="56" height="42" rx="6" fill="#92400E" opacity="0.5"/>
    <!-- front wallet fold -->
    <g filter="url(#shadow4)">
      <rect x="200" y="470" width="624" height="290" rx="64" fill="url(#g4wal2)"/>
    </g>
    <!-- stitch line -->
    <line x1="240" y1="510" x2="784" y2="510" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="10 10"/>
    <!-- clasp -->
    <circle cx="512" cy="615" r="74" fill="#F8FAFC"/>
    <circle cx="512" cy="615" r="74" fill="none" stroke="#1E40AF" stroke-width="3" stroke-opacity="0.2"/>
    <text x="512" y="648" font-family="-apple-system, system-ui, Helvetica, Arial" font-size="92" font-weight="800" fill="#1E3A8A" text-anchor="middle">€</text>
  </g>
</svg>
