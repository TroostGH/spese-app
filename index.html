<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spese</title>
<meta name="theme-color" content="#2d5a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spese">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f1ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1a1814;min-height:100vh;font-size:15px;padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:820px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h1{font-size:1.9rem;font-weight:300;letter-spacing:-0.5px;margin-bottom:4px}
.sub{color:#888;font-size:13px;margin-bottom:1.75rem}

.tabs{display:flex;gap:2px;background:#e8e3db;padding:3px;border-radius:10px;width:100%;margin-bottom:1.75rem}
.tab{flex:1;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:#888;transition:all .15s;text-align:center}
.tab.active{background:#fff;color:#1a1814;box-shadow:0 1px 4px rgba(0,0,0,.1)}

.card{background:#fff;border:1px solid #ddd8d0;border-radius:14px;padding:1.25rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.full{grid-column:1/-1}
.lbl{display:block;font-size:11px;font-weight:600;color:#888;margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
input[type=text],input[type=number],input[type=date],select{
  width:100%;padding:11px 12px;border:1.5px solid #ddd8d0;border-radius:8px;
  font-family:inherit;font-size:16px;color:#1a1814;background:#f9f7f4;
  outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none
}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,select:focus{border-color:#2d5a3d;background:#fff}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{padding:11px 22px;border-radius:8px;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;border:1.5px solid #ddd8d0;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn-primary{background:#2d5a3d;color:#fff;border-color:#2d5a3d}
.btn-primary:active{background:#1e4a2e}
.btn-ghost{background:#fff;color:#888}
.btn-ghost:active{background:#f0ede8}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:7px}

.sync-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:1.25rem}
.sync-lbl{font-size:12px;color:#aaa}
.month-block{margin-bottom:1.5rem}
.month-hdr{display:flex;align-items:baseline;gap:10px;margin-bottom:.6rem}
.month-hdr h3{font-size:1.05rem;font-weight:400}
.month-tot{font-size:13px;color:#888;font-variant-numeric:tabular-nums}
.exp-list{background:#fff;border:1px solid #ddd8d0;border-radius:14px;overflow:hidden}
.exp-row{display:flex;align-items:center;gap:10px;padding:12px 14px;transition:background .1s;-webkit-tap-highlight-color:transparent}
.exp-row:active{background:#f9f7f4}
.exp-row+.exp-row{border-top:1px solid #f0ede8}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.exp-info{flex:1;min-width:0}
.exp-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-meta{font-size:12px;color:#aaa;margin-top:2px}
.exp-amt{font-size:14px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.del-btn{width:32px;height:32px;border:none;background:transparent;color:#ccc;cursor:pointer;border-radius:8px;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.del-btn:active{background:#fdeaea;color:#a02020}

.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.stat{background:#f0ede8;border-radius:10px;padding:1rem 1.1rem}
.stat-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#aaa;margin-bottom:4px}
.stat-val{font-size:1.3rem;font-weight:500;font-variant-numeric:tabular-nums}
.sec-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#aaa;margin-bottom:12px}
.cat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #f0ede8}
.cat-name{flex:1;font-size:14px}
.bar-wrap{width:70px;height:4px;background:#f0ede8;border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;background:#2d5a3d}
.cat-amt{font-size:13px;color:#888;min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
.pct-lbl{font-size:11px;color:#bbb;min-width:34px;text-align:right}

.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.b-fineco{background:#e8f0fc;color:#1a50a0}
.b-amex{background:#faf3e0;color:#806010}
.b-revolut{background:#f0e8fc;color:#5010a0}
.b-n26{background:#e8f8ec;color:#106030}
.b-contanti{background:#f0ede8;color:#605040}

.d-tasse{background:#c47a3a}.d-viaggi{background:#4a7fb5}.d-casa{background:#7a9e5a}
.d-sport{background:#d45e3a}.d-regali{background:#b05090}.d-spesa{background:#5aa08a}
.d-sfizi{background:#8060b0}.d-auto{background:#607080}.d-shopping{background:#d08040}
.d-formazione{background:#3090a0}.d-bar{background:#c05050}.d-lavoro{background:#4060a0}
.d-trasporti{background:#507050}.d-intrattenimento{background:#a050a0}
.d-medico{background:#5080c0}.d-altro{background:#909090}

.empty{text-align:center;padding:3rem 1rem;color:#bbb;font-size:14px}
.search-bar{position:relative;margin-bottom:1rem}
.search-bar input{width:100%;padding:11px 12px 11px 38px;border:1.5px solid #ddd8d0;border-radius:10px;font-family:inherit;font-size:15px;color:#1a1814;background:#fff;outline:none;transition:border-color .15s}
.search-bar input:focus{border-color:#2d5a3d}
.search-bar input::placeholder{color:#bbb}
.search-bar .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#bbb;font-size:16px;pointer-events:none}
.hidden{display:none!important}
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.month-nav select{max-width:240px;font-size:15px}
.month-nav .lbl{white-space:nowrap;margin-bottom:0}

/* Export modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border-radius:16px;padding:1.5rem;max-width:380px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.modal h3{font-size:1.1rem;font-weight:500;margin-bottom:1rem}
.modal-options{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;max-height:50vh;overflow-y:auto;padding-right:4px}
.modal-opt{padding:12px 14px;border:1.5px solid #ddd8d0;border-radius:10px;background:#f9f7f4;font-family:inherit;font-size:14px;cursor:pointer;text-align:left;transition:all .15s;color:#1a1814}
.modal-opt:active,.modal-opt.selected{border-color:#2d5a3d;background:#eef5f0}
.modal-date-range{display:none;gap:10px;margin-bottom:1rem}
.modal-date-range.visible{display:flex}
.modal-date-range label{flex:1}
.modal-date-range .lbl{font-size:11px;font-weight:600;color:#888;margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase;display:block}
.modal-date-range input{width:100%;padding:10px 12px;border:1.5px solid #ddd8d0;border-radius:8px;font-family:inherit;font-size:15px;color:#1a1814;background:#f9f7f4;outline:none;-webkit-appearance:none;appearance:none}
.modal-date-range input:focus{border-color:#2d5a3d;background:#fff}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}

/* Install banner */
#install-bar{background:#2d5a3d;color:#fff;padding:12px 16px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:1.25rem;font-size:14px}
#install-bar button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}

/* Carosello schermate */
body{overflow-x:hidden}
html,body{touch-action:pan-y pinch-zoom}
#pager{margin:0 -1.25rem;overflow:hidden;overflow:clip}
#track{display:flex;align-items:flex-start;will-change:transform}
.pane{flex:0 0 100%;width:100%;padding:0 1.25rem;min-width:0;contain:layout paint}

/* Indicatore delle schede che scorre insieme alle pagine */
#main-tabs{position:relative}
#main-tabs .tab{position:relative;z-index:1;background:transparent;box-shadow:none;transition:color .2s}
#tab-ind{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1);will-change:transform;pointer-events:none}

/* Categorie cliccabili nel riepilogo */
.cat-row.clickable{cursor:pointer;-webkit-tap-highlight-color:transparent;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px;transition:background .12s}
.cat-row.clickable:active{background:#f4f1ec}
.cat-chev{color:#c8c2b8;font-size:18px;line-height:1;margin-left:-2px}

/* Pannello dal basso (bottom sheet) */
.sheet-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;visibility:hidden;pointer-events:none;transition:visibility 0s linear .4s}
.sheet-overlay.open{visibility:visible;pointer-events:auto;transition:none}
.sheet-backdrop{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .32s ease}
.sheet-overlay.open .sheet-backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:820px;max-height:85vh;max-height:85dvh;background:#f4f1ec;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:translate3d(0,100%,0);transition:transform .36s cubic-bezier(.25,.9,.3,1);will-change:transform;padding-bottom:env(safe-area-inset-bottom)}
.sheet-overlay.open .sheet{transform:translate3d(0,0,0)}
.sheet-head{flex-shrink:0;padding:10px 1.25rem 14px;touch-action:none;cursor:grab}
.sheet-grip{width:42px;height:5px;border-radius:3px;background:#cfc8bd;margin:0 auto 14px}
.sheet-title-row{display:flex;align-items:center;gap:10px}
.sheet-title-row .dot{width:10px;height:10px}
.sheet-title{flex:1;min-width:0;font-size:1.25rem;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-tot{font-size:1.1rem;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet-sub{font-size:13px;color:#888;margin-top:3px;padding-left:20px}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 1.25rem 1.5rem}
</style>
</head>
<body>
<div class="app">

  <div id="install-bar" class="hidden">
    <span>📲 Aggiungi alla home screen per usarla come app</span>
    <button onclick="installApp()">Installa</button>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <h1>Le mie spese</h1>
    <button id="settings-btn" onclick="openSettings()" title="Impostazioni" aria-label="Impostazioni" style="background:transparent;border:none;font-size:22px;cursor:pointer;padding:6px 4px;line-height:1;-webkit-tap-highlight-color:transparent">⚙️</button>
  </div>
  <div class="sub" id="hdate"></div>

  <div class="tabs" id="main-tabs">
    <div id="tab-ind"></div>
    <button class="tab active" id="tab-btn-add" onclick="showTab('add')">+ Aggiungi</button>
    <button class="tab" id="tab-btn-list" onclick="showTab('list')">Elenco</button>
    <button class="tab" id="tab-btn-summary" onclick="showTab('summary')">Riepilogo</button>
  </div>

  <div id="pager"><div id="track">
  <!-- ADD -->
  <div id="pane-add" class="pane">
    <div class="card">
      <div class="grid2">
        <div class="full">
          <label class="lbl" for="f-name">Descrizione</label>
          <input type="text" id="f-name" placeholder="Es. Supermercato, palestra…" autocomplete="off" autocorrect="off">
        </div>
        <div>
          <label class="lbl" for="f-amount">Importo (€)</label>
          <input type="number" id="f-amount" placeholder="0.00" step="0.01" min="0.01" inputmode="decimal">
        </div>
        <div>
          <label class="lbl" for="f-date">Data</label>
          <input type="date" id="f-date">
        </div>
        <div>
          <label class="lbl" for="f-cat">Categoria</label>
          <select id="f-cat"></select>
        </div>
        <div>
          <label class="lbl" for="f-pay">Pagamento</label>
          <select id="f-pay"></select>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="cancel-edit-btn" onclick="cancelEdit()" class="hidden" style="display:none">Annulla modifica</button>
        <button class="btn btn-ghost" onclick="resetForm()">Pulisci</button>
        <button class="btn btn-primary" id="save-btn" onclick="addExpense()">Salva spesa</button>
      </div>
    </div>
  </div>

  <!-- LIST -->
  <div id="pane-list" class="pane">
    <div class="sync-bar">
      <span class="sync-lbl" id="sync-status">☁️ Connessione…</span>
      <button class="btn btn-ghost btn-sm" onclick="doExport()">↓ Esporta JSON</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('file-in').click()">↑ Importa JSON</button>
      <input type="file" id="file-in" accept=".json" class="hidden" onchange="doImport(event)">
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Cerca spesa…" autocomplete="off" oninput="renderList()">
    </div>
    <div id="list-body"></div>
  </div>

  <!-- SUMMARY -->
  <div id="pane-summary" class="pane">
    <!-- Toggle mese / anno -->
    <div class="tabs" style="margin-bottom:1rem">
      <button class="tab active" id="sum-tab-month" onclick="setSumView('month')">Mese</button>
      <button class="tab" id="sum-tab-year" onclick="setSumView('year')">Anno</button>
    </div>
    <!-- Navigazione mese -->
    <div id="sum-month-nav" class="month-nav">
      <label class="lbl" for="sel-month">Mese</label>
      <select id="sel-month" onchange="renderSummary()"></select>
    </div>
    <!-- Navigazione anno -->
    <div id="sum-year-nav" class="month-nav hidden">
      <label class="lbl" for="sel-year">Anno</label>
      <select id="sel-year" onchange="renderYearSummary()"></select>
    </div>
    <div id="sum-body"></div>
  </div>
  </div></div>

  <!-- EXPORT MODAL -->
  <div id="export-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeExportModal()">
    <div class="modal">
      <h3>Esporta spese</h3>
      <div class="modal-options" id="export-month-list"></div>
      <div class="modal-date-range" id="export-date-range">
        <label>
          <span class="lbl">Da</span>
          <input type="date" id="export-from">
        </label>
        <label>
          <span class="lbl">A</span>
          <input type="date" id="export-to">
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeExportModal()">Annulla</button>
        <button class="btn btn-primary" id="export-confirm-btn" onclick="confirmExport()">Esporta</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeSettings()">
    <div class="modal" style="max-width:440px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch">
      <h3>Impostazioni</h3>
      <div style="margin-bottom:1.25rem">
        <div class="sec-lbl" style="margin-bottom:8px">Categorie</div>
        <div id="cat-list"></div>
        <div style="display:flex;gap:6px;margin-top:10px">
          <input type="text" id="new-cat-name" placeholder="Nuova categoria…" maxlength="40" autocomplete="off" style="flex:1">
          <button class="btn btn-primary btn-sm" onclick="addCategory()">+ Aggiungi</button>
        </div>
      </div>
      <div style="margin-bottom:1.25rem">
        <div class="sec-lbl" style="margin-bottom:8px">Metodi di pagamento</div>
        <div id="pay-list"></div>
        <div style="display:flex;gap:6px;margin-top:10px">
          <input type="text" id="new-pay-name" placeholder="Nuovo metodo…" maxlength="30" autocomplete="off" style="flex:1">
          <button class="btn btn-primary btn-sm" onclick="addPayment()">+ Aggiungi</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="closeSettings()">Chiudi</button>
      </div>
    </div>
  </div>

</div>

<!-- PANNELLO CATEGORIA -->
<div id="cat-sheet" class="sheet-overlay" aria-hidden="true">
  <div class="sheet-backdrop" id="cs-backdrop" onclick="closeCatSheet()"></div>
  <div class="sheet" id="cs-panel" role="dialog" aria-modal="true" aria-labelledby="cs-title">
    <div class="sheet-head">
      <div class="sheet-grip"></div>
      <div class="sheet-title-row">
        <span class="dot" id="cs-dot"></span>
        <div class="sheet-title" id="cs-title"></div>
        <div class="sheet-tot" id="cs-tot"></div>
      </div>
      <div class="sheet-sub" id="cs-sub"></div>
    </div>
    <div class="sheet-body" id="cs-body"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
var STORAGE_KEY = 'spese_v1';
var expenses = [];
var deferredPrompt = null;
var currentTab = 'add';
var sumView = 'month';
var db = null;
var editingId = null;

var firebaseConfig = {
  apiKey: "AIzaSyBtuJg2AhxUJDrkkMY693Sg5MKcCZYr3bY",
  authDomain: "spese-app-189b1.firebaseapp.com",
  projectId: "spese-app-189b1",
  storageBucket: "spese-app-189b1.firebasestorage.app",
  messagingSenderId: "399300562167",
  appId: "1:399300562167:web:95fb3dc605dcb3b766d7f2"
};

var DEFAULT_CATEGORIES = [
  {name:'Tasse', color:'#c47a3a'},
  {name:'Viaggi', color:'#4a7fb5'},
  {name:'Casa', color:'#7a9e5a'},
  {name:'Sport', color:'#d45e3a'},
  {name:'Regali', color:'#b05090'},
  {name:'Spesa', color:'#5aa08a'},
  {name:'Sfizi e Tecnologia', color:'#8060b0'},
  {name:'Auto', color:'#607080'},
  {name:'Shopping', color:'#d08040'},
  {name:'Formazione', color:'#3090a0'},
  {name:'Bar e Ristoranti', color:'#c05050'},
  {name:'Lavoro', color:'#4060a0'},
  {name:'Trasporti', color:'#507050'},
  {name:'Intrattenimento', color:'#a050a0'},
  {name:'Medico', color:'#5080c0'},
  {name:'Altro', color:'#909090'}
];
var DEFAULT_PAYMENTS = [
  {name:'Fineco', bg:'#e8f0fc', fg:'#1a50a0'},
  {name:'Amex', bg:'#faf3e0', fg:'#806010'},
  {name:'Revolut', bg:'#f0e8fc', fg:'#5010a0'},
  {name:'N26', bg:'#e8f8ec', fg:'#106030'},
  {name:'Contanti', bg:'#f0ede8', fg:'#605040'}
];
var CAT_PALETTE = ['#c47a3a','#4a7fb5','#7a9e5a','#d45e3a','#b05090','#5aa08a','#8060b0','#607080','#d08040','#3090a0','#c05050','#4060a0','#507050','#a050a0','#5080c0','#6a8e3a','#3a8e6a','#8e3a6a','#3a6a8e','#8e6a3a','#bf6f8f','#6fbf8f','#8fbf6f','#6f8fbf'];
var PAY_PALETTE = [
  {bg:'#e8f0fc', fg:'#1a50a0'},
  {bg:'#faf3e0', fg:'#806010'},
  {bg:'#f0e8fc', fg:'#5010a0'},
  {bg:'#e8f8ec', fg:'#106030'},
  {bg:'#fce8e8', fg:'#a02020'},
  {bg:'#fcf3e8', fg:'#a06010'},
  {bg:'#e8f8fc', fg:'#106080'},
  {bg:'#f0ede8', fg:'#605040'}
];
var CONFIG_KEY = 'spese_config_v1';
var CONFIG_DOC_ID = '__settings__';
var categories = DEFAULT_CATEGORIES.slice();
var payments = DEFAULT_PAYMENTS.slice();

function findCat(name) {
  for (var i=0;i<categories.length;i++) if (categories[i].name===name) return categories[i];
  return null;
}
function findPay(name) {
  for (var i=0;i<payments.length;i++) if (payments[i].name===name) return payments[i];
  return null;
}
function catColor(name) {
  var c = findCat(name); return c ? c.color : '#909090';
}
function payStyle(name) {
  var p = findPay(name);
  if (p) return 'background:'+p.bg+';color:'+p.fg;
  return 'background:#f0ede8;color:#605040';
}
function autoCatColor() {
  var used = {};
  for (var i=0;i<categories.length;i++) used[categories[i].color] = 1;
  for (var i=0;i<CAT_PALETTE.length;i++) if (!used[CAT_PALETTE[i]]) return CAT_PALETTE[i];
  var hue = (categories.length * 47) % 360;
  return 'hsl('+hue+',55%,50%)';
}
function autoPayColors() {
  var used = {};
  for (var i=0;i<payments.length;i++) used[payments[i].bg] = 1;
  for (var i=0;i<PAY_PALETTE.length;i++) if (!used[PAY_PALETTE[i].bg]) return PAY_PALETTE[i];
  return PAY_PALETTE[payments.length % PAY_PALETTE.length];
}
function ensureAltro() {
  if (!findCat('Altro')) categories.push({name:'Altro', color:'#909090'});
}
function jsStr(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}
var MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

window.addEventListener('beforeinstallprompt', function(e) {

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    expenses = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(expenses)) expenses = [];
  } catch(e) { expenses = []; }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
  if (typeof markStale === 'function') markStale();
}

function setSyncStatus(msg) {
  var el = document.getElementById('sync-status');
  if (el) el.textContent = msg;
}

function initFirebase() {
  try {
    firebase.initializeApp(firebaseConfig);
    setSyncStatus('☁️ Autenticazione…');
    // Login anonimo: senza questo le regole di sicurezza Firestore rifiutano le richieste
    firebase.auth().signInAnonymously().then(function() {
      db = firebase.firestore();
      // Abilita persistenza offline
      db.enablePersistence({synchronizeTabs: true}).catch(function(err) {
        console.log('Persistenza non disponibile:', err.code);
      });
      setSyncStatus('☁️ Connessione…');
      db.collection('expenses').onSnapshot(function(snapshot) {
        expenses = [];
        var configFromDb = null;
        snapshot.forEach(function(doc) {
          var d = doc.data();
          if (doc.id === CONFIG_DOC_ID || (d && d._isConfig)) { configFromDb = d; return; }
          expenses.push(d);
        });
        if (configFromDb) {
          if (Array.isArray(configFromDb.categories) && configFromDb.categories.length) categories = configFromDb.categories;
          if (Array.isArray(configFromDb.payments) && configFromDb.payments.length) payments = configFromDb.payments;
          ensureAltro();
          try { localStorage.setItem(CONFIG_KEY, JSON.stringify({categories:categories, payments:payments})); } catch(_e){}
          populateSelects();
          if (document.getElementById('settings-modal') && !document.getElementById('settings-modal').classList.contains('hidden')) renderSettings();
        }
        expenses.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(b.id-a.id); });
        saveData(); // cache locale
        setSyncStatus('☁️ Sincronizzato');
        // Aggiorna la vista corrente
        if (currentTab==='list') renderList();
        if (currentTab==='summary') {
          if (sumView==='month') { fillMonthSelect(); renderSummary(); }
          else { fillYearSelect(); renderYearSummary(); }
        }
      }, function(error) {
        console.error('Firebase error:', error);
        setSyncStatus('⚠️ Modalità offline');
      });
    }).catch(function(err) {
      console.error('Auth error:', err);
      setSyncStatus('⚠️ Errore autenticazione');
    });
  } catch(e) {
    console.error('Firebase init error:', e);
    setSyncStatus('⚠️ Errore connessione');
  }
}

function todayISO() {
  var d = new Date();
  var mm = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + mm + '-' + dd;
}

function fmtMoney(n) {
  return '€ ' + Number(n).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}

function fmtDateIT(iso) {
  var p = iso.split('-');
  return p[2]+'/'+p[1]+'/'+p[0];
}

function monthKey(iso) { return iso.slice(0,7); }
function monthLabel(k) {
  var p = k.split('-');
  return MONTHS[parseInt(p[1],10)-1]+' '+p[0];
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function init() {
  loadData(); // caricamento rapido da localStorage
  loadConfig(); // categorie e metodi di pagamento personalizzati
  populateSelects();
  document.getElementById('f-date').value = todayISO();
  var now = new Date();
  document.getElementById('hdate').textContent = now.toLocaleDateString('it-IT',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function(e){ console.log('SW error',e); });
  }
  initFirebase();
}

var TAB_ORDER = ['add','list','summary'];
var pager = null, track = null, swiping = false, heightTimer = null, preTimer = null;
var paneStale = {add:false, list:true, summary:true};

// Le pagine vengono preparate in anticipo (a riposo), così lo swipe non deve aspettare
function markStale() { paneStale.list = paneStale.summary = true; schedulePrerender(); if (typeof catSheet !== 'undefined' && catSheet.open) renderCatSheet(); }
function schedulePrerender() {
  clearTimeout(preTimer);
  preTimer = setTimeout(function() {
    if (swiping) { schedulePrerender(); return; }
    for (var i = 0; i < TAB_ORDER.length; i++) {
      var n = TAB_ORDER[i];
      if (!paneStale[n]) continue;
      if (n === currentTab) paneStale[n] = false; // la pagina visibile è già aggiornata dal resto del codice
      else renderPane(n);
    }
    if (!swiping) fitHeight();
  }, 400);
}

function renderPane(name) {
  paneStale[name] = false;
  if (name==='list') renderList();
  if (name==='summary') {
    if (sumView==='month') { fillMonthSelect(); renderSummary(); }
    else { fillYearSelect(); renderYearSummary(); }
  }
}
var SNAP_EASE = 'cubic-bezier(.25,.9,.3,1)';
var pagerW = 0, animating = false;
var tabInd = null, indX0 = 0, indStep = 0;

function measurePager() {
  pagerW = pager.clientWidth || 1;
  if (!tabInd) return;
  var b0 = document.getElementById('tab-btn-add'), b1 = document.getElementById('tab-btn-list');
  indX0 = b0.offsetLeft; indStep = b1.offsetLeft - b0.offsetLeft;
  tabInd.style.width = b0.offsetWidth + 'px';
}
// Sposta le pagine (e l'indicatore delle schede) solo con transform: lavora la GPU, niente ricalcolo della pagina
function setTrack(px, dur) {
  var tr = dur ? 'transform ' + dur + 'ms ' + SNAP_EASE : 'none';
  track.style.transition = tr;
  track.style.transform = 'translate3d(' + px + 'px,0,0)';
  if (tabInd) {
    tabInd.style.transition = tr;
    tabInd.style.transform = 'translate3d(' + (indX0 + (-px / pagerW) * indStep) + 'px,0,0)';
  }
}
function paneH(name) { return document.getElementById('pane-'+name).offsetHeight; }
function fitHeight() { if (pager) pager.style.height = paneH(currentTab) + 'px'; }

function showTab(name, noAnim, dur) {
  var prev = currentTab;
  currentTab = name;
  for (var i = 0; i < TAB_ORDER.length; i++) {
    document.getElementById('tab-btn-'+TAB_ORDER[i]).classList.toggle('active', TAB_ORDER[i]===name);
  }
  if (!pager) { renderPane(name); return; }
  if (paneStale[name]) renderPane(name);
  var d = noAnim ? 0 : (dur || 340);
  // L'altezza cambia di colpo (non animata) e solo prima/dopo lo scorrimento, mai durante
  pager.style.height = Math.max(paneH(prev), paneH(name)) + 'px';
  animating = d > 0;
  setTrack(-TAB_ORDER.indexOf(name) * pagerW, d);
  clearTimeout(heightTimer);
  heightTimer = setTimeout(function() { animating = false; if (!swiping) fitHeight(); }, d + 40);
  var tabs = document.getElementById('main-tabs');
  if (prev !== name && window.scrollY > tabs.offsetTop) window.scrollTo({top: tabs.offsetTop - 10, behavior: 'smooth'});
}

// --- Swipe che segue il dito ---
(function setupPager() {
  pager = document.getElementById('pager');
  track = document.getElementById('track');
  tabInd = document.getElementById('tab-ind');
  measurePager();
  var sx, sy, idx, lock, lastX, lastT, vel, curX = 0, raf = 0, pendingX = 0;

  function reset() { swiping = false; lock = null; if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  function paint() { raf = 0; setTrack(pendingX, 0); }
  window.addEventListener('resize', function() {
    measurePager();
    setTrack(-TAB_ORDER.indexOf(currentTab) * pagerW, 0); fitHeight();
  });
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function() { if (!swiping && !animating) fitHeight(); });
    for (var i = 0; i < TAB_ORDER.length; i++) ro.observe(document.getElementById('pane-'+TAB_ORDER[i]));
  }

  // Lo swipe funziona su tutto lo schermo, non solo sopra il contenuto della pagina
  document.addEventListener('touchstart', function(e) {
    reset();
    if (e.touches.length !== 1) return;
    var t = e.target;
    if (document.querySelector('.modal-overlay:not(.hidden), .sheet-overlay.open')) return; // finestre aperte
    if (t.closest && t.closest('textarea,input[type=range]')) return;
    if (t === document.activeElement && t.tagName === 'INPUT') return; // campo in cui stai scrivendo
    sx = lastX = e.touches[0].clientX; sy = e.touches[0].clientY;
    lastT = Date.now(); vel = 0; lock = 'pending';
  }, {passive: true});

  document.addEventListener('touchmove', function(e) {
    if (!lock) return;
    var x = e.touches[0].clientX, y = e.touches[0].clientY;
    var dx = x - sx, dy = y - sy;
    if (lock === 'pending') {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dx) <= Math.abs(dy)) { lock = null; return; } // scorrimento verticale: lascio fare al browser
      lock = 'h'; swiping = true; animating = false;
      var ae = document.activeElement;
      if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT')) ae.blur(); // chiude la tastiera
      idx = TAB_ORDER.indexOf(currentTab);
      clearTimeout(heightTimer);
      // prepara subito le pagine vicine (se servono) e fissa l'altezza una volta sola
      var h = paneH(currentTab);
      for (var k = idx - 1; k <= idx + 1; k += 2) {
        if (k < 0 || k >= TAB_ORDER.length) continue;
        if (paneStale[TAB_ORDER[k]]) renderPane(TAB_ORDER[k]);
        h = Math.max(h, paneH(TAB_ORDER[k]));
      }
      pager.style.height = h + 'px';
      measurePager();
      sx = x; dx = 0; // parte da dove il dito ha "agganciato"
    }
    if (e.cancelable) e.preventDefault();
    var now = Date.now(), dt = now - lastT;
    if (dt > 0) vel = 0.6 * ((x - lastX) / dt) + 0.4 * vel;
    lastX = x; lastT = now;
    var off = dx;
    if ((idx === 0 && dx > 0) || (idx === TAB_ORDER.length-1 && dx < 0)) off = dx * 0.3; // resistenza ai bordi
    curX = -idx * pagerW + off;
    pendingX = curX;
    if (!raf) raf = requestAnimationFrame(paint); // un aggiornamento per fotogramma
  }, {passive: false});

  function end(cancel) {
    if (!swiping) { reset(); return; }
    var dx = lastX - sx;
    if (Date.now() - lastT > 100) vel = 0; // dito fermo prima di staccare
    var target = idx;
    if (!cancel) {
      var reversing = (vel > 0.2 && dx < 0) || (vel < -0.2 && dx > 0);
      if (!reversing) {
        if (dx < 0 && (dx < -pagerW * 0.3 || (vel < -0.35 && dx < -20))) target = idx + 1;
        if (dx > 0 && (dx >  pagerW * 0.3 || (vel >  0.35 && dx >  20))) target = idx - 1;
      }
      target = Math.max(0, Math.min(TAB_ORDER.length-1, target));
    }
    reset();
    // durata in base a quanto manca e alla velocità del dito: l'animazione continua il gesto senza strappi
    var remaining = Math.abs(-target * pagerW - curX);
    var dur = 160 + 240 * (remaining / pagerW);
    var v = Math.abs(vel);
    if (v > 0.2) dur = Math.min(dur, 3.6 * remaining / v);
    dur = Math.round(Math.max(150, Math.min(400, dur)));
    showTab(TAB_ORDER[target], false, dur);
  }
  document.addEventListener('touchend', function() { end(false); });
  document.addEventListener('touchcancel', function() { end(true); });
  showTab(currentTab, true);
  schedulePrerender();
})();

function setSumView(v) {

function editExpense(id) {
  var exp = null;
  for (var i = 0; i < expenses.length; i++) {
    if (expenses[i].id === id) { exp = expenses[i]; break; }
  }
  if (!exp) return;
  editingId = id;
  document.getElementById('f-name').value = exp.name;
  document.getElementById('f-amount').value = exp.amount;
  document.getElementById('f-date').value = exp.date;
  document.getElementById('f-cat').value = exp.cat;
  document.getElementById('f-pay').value = exp.pay;
  document.getElementById('save-btn').textContent = 'Aggiorna spesa';
  document.getElementById('cancel-edit-btn').style.display = '';
  showTab('add');
  document.getElementById('f-name').focus();
}

function cancelEdit() {
  editingId = null;
  document.getElementById('save-btn').textContent = 'Salva spesa';
  document.getElementById('cancel-edit-btn').style.display = 'none';
  resetForm();
}

function addExpense() {
  var name = document.getElementById('f-name').value.trim();
  var amountRaw = document.getElementById('f-amount').value;
  var amount = parseFloat(amountRaw);
  var date = document.getElementById('f-date').value;
  var cat = document.getElementById('f-cat').value;
  var pay = document.getElementById('f-pay').value;

  if (!name) { alert('Inserisci una descrizione.'); return; }
  if (!amountRaw || isNaN(amount) || amount<=0) { alert('Inserisci un importo valido.'); return; }
  if (!date) { alert('Inserisci una data.'); return; }

  var btn = document.getElementById('save-btn');
  btn.disabled = true;

  if (editingId) {
    // Modalità modifica
    var updated = {id:editingId, name:name, amount:amount, date:date, cat:cat, pay:pay};
    if (db) {
      db.collection('expenses').doc(String(editingId)).set(updated)
        .then(function() {
          editingId = null;
          resetForm();
          btn.disabled = false;
          btn.textContent = '✓ Aggiornata!';
          btn.style.background = '#1e7040';
          document.getElementById('cancel-edit-btn').style.display = 'none';
          setTimeout(function(){ btn.textContent='Salva spesa'; btn.style.background=''; }, 1800);
        })
        .catch(function(e) {
          console.error('Update error:', e);
          alert('Errore nell\'aggiornamento. Riprova.');
          btn.disabled = false;
        });
    } else {
      for (var i = 0; i < expenses.length; i++) {
        if (expenses[i].id === editingId) { expenses[i] = updated; break; }
      }
      expenses.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(b.id-a.id); });
      saveData();
      editingId = null;
      resetForm();
      btn.disabled = false;
      btn.textContent = '✓ Aggiornata!';
      btn.style.background = '#1e7040';
      document.getElementById('cancel-edit-btn').style.display = 'none';
      setTimeout(function(){ btn.textContent='Salva spesa'; btn.style.background=''; }, 1800);
    }
    return;
  }

  var id = Date.now();
  var expense = {id:id, name:name, amount:amount, date:date, cat:cat, pay:pay};

  if (db) {
    db.collection('expenses').doc(String(id)).set(expense)
      .then(function() {
        resetForm();
        btn.disabled = false;
        btn.textContent = '✓ Salvata!';
        btn.style.background = '#1e7040';
        setTimeout(function(){ btn.textContent='Salva spesa'; btn.style.background=''; }, 1800);
      })
      .catch(function(e) {
        console.error('Save error:', e);
        alert('Errore nel salvataggio. Riprova.');
        btn.disabled = false;
      });
  } else {
    // Fallback localStorage
    expenses.push(expense);
    expenses.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(b.id-a.id); });
    saveData();
    resetForm();
    btn.disabled = false;
    btn.textContent = '✓ Salvata!';
    btn.style.background = '#1e7040';
    setTimeout(function(){ btn.textContent='Salva spesa'; btn.style.background=''; }, 1800);
  }
}

function resetForm() {
  document.getElementById('f-name').value = '';
  document.getElementById('f-amount').value = '';
  document.getElementById('f-date').value = todayISO();
  if (editingId) {
    editingId = null;
    document.getElementById('save-btn').textContent = 'Salva spesa';
    document.getElementById('cancel-edit-btn').style.display = 'none';
  }
}

function deleteExpense(id) {
  if (!confirm('Eliminare questa spesa?')) return;
  if (db) {
    db.collection('expenses').doc(String(id)).delete()
      .catch(function(e) { console.error('Delete error:', e); alert('Errore durante l\'eliminazione.'); });
    // onSnapshot aggiornerà automaticamente la lista
  } else {
    expenses = expenses.filter(function(e){ return e.id!==id; });
    saveData();
    renderList();
  }
}

function renderList() {
  var el = document.getElementById('list-body');
  if (!expenses.length) { el.innerHTML='<div class="empty">Nessuna spesa ancora registrata.</div>'; return; }
  var searchEl = document.getElementById('search-input');
  var query = searchEl ? searchEl.value.trim().toLowerCase() : '';
  var filtered = expenses;
  if (query) {
    filtered = expenses.filter(function(e) {
      return e.name.toLowerCase().indexOf(query) !== -1 ||
             e.cat.toLowerCase().indexOf(query) !== -1 ||
             e.pay.toLowerCase().indexOf(query) !== -1 ||
             fmtDateIT(e.date).indexOf(query) !== -1 ||
             String(e.amount).indexOf(query) !== -1;
    });
  }
  if (!filtered.length) { el.innerHTML='<div class="empty">'+(query?'Nessun risultato per "'+esc(query)+'".' : 'Nessuna spesa ancora registrata.')+'</div>'; return; }
  var groups = {};
  for (var i=0;i<filtered.length;i++) {
    var m = monthKey(filtered[i].date);
    if (!groups[m]) groups[m]=[];
    groups[m].push(filtered[i]);
  }
  var keys = Object.keys(groups).sort(function(a,b){ return a<b?1:-1; });
  var html = '';
  for (var k=0;k<keys.length;k++) {
    var m = keys[k], list = groups[m], tot=0;
    list.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(b.id-a.id); });
    for (var j=0;j<list.length;j++) tot+=list[j].amount;
    var rows='';
    for (var j=0;j<list.length;j++) {
      var e=list[j];
      rows+='<div class="exp-row" onclick="editExpense('+e.id+')" style="cursor:pointer">'+
        '<div class="dot" style="background:'+catColor(e.cat)+'"></div>'+
        '<div class="exp-info">'+
          '<div class="exp-name">'+esc(e.name)+'</div>'+
          '<div class="exp-meta">'+fmtDateIT(e.date)+' &middot; '+esc(e.cat)+' &middot; <span class="badge" style="'+payStyle(e.pay)+'">'+esc(e.pay)+'</span></div>'+
        '</div>'+
        '<div class="exp-amt">'+fmtMoney(e.amount)+'</div>'+
        '<button class="del-btn" onclick="event.stopPropagation();deleteExpense('+e.id+')" title="Elimina">&times;</button>'+
      '</div>';
    }
    html+='<div class="month-block">'+
      '<div class="month-hdr"><h3>'+monthLabel(m)+'</h3><span class="month-tot">'+fmtMoney(tot)+'</span></div>'+
      '<div class="exp-list">'+rows+'</div></div>';
  }
  el.innerHTML=html;
}

function fillMonthSelect() {
  var sel=document.getElementById('sel-month');
  var prev=sel.value;
  var all=[];
  for (var i=0;i<expenses.length;i++) {
    var m=monthKey(expenses[i].date);
    if (all.indexOf(m)===-1) all.push(m);
  }
  all.sort(function(a,b){ return a<b?1:-1; });
  var cur=todayISO().slice(0,7);
  if (all.indexOf(cur)===-1) all.unshift(cur);
  var opts='';
  for (var i=0;i<all.length;i++) opts+='<option value="'+all[i]+'">'+monthLabel(all[i])+'</option>';
  sel.innerHTML=opts;
  if (prev&&all.indexOf(prev)!==-1) sel.value=prev;
}

function fillYearSelect() {
  var sel=document.getElementById('sel-year');
  var prev=sel.value;
  var years=[];
  for (var i=0;i<expenses.length;i++) {
    var y=expenses[i].date.slice(0,4);
    if (years.indexOf(y)===-1) years.push(y);
  }
  years.sort(function(a,b){ return a<b?1:-1; });
  var curY=String(new Date().getFullYear());
  if (years.indexOf(curY)===-1) years.unshift(curY);
  var opts='';
  for (var i=0;i<years.length;i++) opts+='<option value="'+years[i]+'">'+years[i]+'</option>';
  sel.innerHTML=opts;
  if (prev&&years.indexOf(prev)!==-1) sel.value=prev;
}

function renderSummary() {
  var m=document.getElementById('sel-month').value;
  var el=document.getElementById('sum-body');
  var data=expenses.filter(function(e){ return monthKey(e.date)===m; });
  if (!data.length) { el.innerHTML='<div class="empty">Nessuna spesa per '+monthLabel(m)+'.</div>'; return; }
  var total=0;
  for (var i=0;i<data.length;i++) total+=data[i].amount;
  var byCat={}, byPay={}, byPayCount={};
  for (var i=0;i<data.length;i++) {
    byCat[data[i].cat]=(byCat[data[i].cat]||0)+data[i].amount;
    byPay[data[i].pay]=(byPay[data[i].pay]||0)+data[i].amount;
    byPayCount[data[i].pay]=(byPayCount[data[i].pay]||0)+1;
  }

var catSheet = {open: false, cat: null, period: null};

function periodLabel(p) { return p.length === 7 ? monthLabel(p) : p; }

function renderCatSheet() {
  var cat = catSheet.cat, p = catSheet.period;
  var data = expenses.filter(function(e) { return e.cat === cat && e.date.slice(0, p.length) === p; });
  data.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(b.id-a.id); });
  var tot = 0;
  for (var i = 0; i < data.length; i++) tot += data[i].amount;
  document.getElementById('cs-dot').style.background = catColor(cat);
  document.getElementById('cs-title').textContent = cat;
  document.getElementById('cs-tot').textContent = fmtMoney(tot);
  document.getElementById('cs-sub').textContent = periodLabel(p) + ' · ' + data.length + (data.length === 1 ? ' spesa' : ' spese');
  var body = document.getElementById('cs-body');
  if (!data.length) { body.innerHTML = '<div class="empty">Nessuna spesa in questa categoria.</div>'; return; }
  var rows = '';
  for (var i = 0; i < data.length; i++) {
    var e = data[i];
    rows += '<div class="exp-row" onclick="editFromSheet(' + e.id + ')" style="cursor:pointer">' +
      '<div class="exp-info">' +
        '<div class="exp-name">' + esc(e.name) + '</div>' +
        '<div class="exp-meta">' + fmtDateIT(e.date) + ' &middot; <span class="badge" style="' + payStyle(e.pay) + '">' + esc(e.pay) + '</span></div>' +
      '</div>' +
      '<div class="exp-amt">' + fmtMoney(e.amount) + '</div>' +
    '</div>';

function openCatSheet(cat, period) {
  catSheet.cat = cat; catSheet.period = period;
  renderCatSheet();
  var panel = document.getElementById('cs-panel');
  panel.style.transition = ''; panel.style.transform = '';
  document.getElementById('cs-backdrop').style.transition = '';
  document.getElementById('cs-backdrop').style.opacity = '';
  document.getElementById('cs-body').scrollTop = 0;
  var ov = document.getElementById('cat-sheet');
  ov.classList.add('open'); ov.setAttribute('aria-hidden', 'false');
  document.documentElement.style.overflow = 'hidden'; // blocca lo scorrimento della pagina sotto
  if (!catSheet.open) {
    catSheet.open = true;
    try { history.pushState({catSheet: 1}, ''); } catch (err) {} // il tasto "indietro" di Android chiude il pannello
  }
}

function closeCatSheet(fromPop, dur) {
  if (!catSheet.open) return;
  catSheet.open = false;
  var panel = document.getElementById('cs-panel'), bd = document.getElementById('cs-backdrop');
  // parte dalla posizione attuale (anche a metà trascinamento) e scende fino in fondo
  panel.style.transition = dur ? 'transform ' + dur + 'ms cubic-bezier(.25,.9,.3,1)' : '';
  panel.style.transform = '';
  bd.style.transition = dur ? 'opacity ' + dur + 'ms ease' : '';
  bd.style.opacity = '';
  var ov = document.getElementById('cat-sheet');
  ov.classList.remove('open'); ov.setAttribute('aria-hidden', 'true');
  document.documentElement.style.overflow = '';
  if (!fromPop && history.state && history.state.catSheet) history.back();
}
window.addEventListener('popstate', function() { if (catSheet.open) closeCatSheet(true); });

function editFromSheet(id) { closeCatSheet(); editExpense(id); }

// Trascina verso il basso per chiudere (dalla linea in alto, o dalla lista quando è già in cima)
(function setupSheetDrag() {
  var panel = document.getElementById('cs-panel');
  var body = document.getElementById('cs-body');
  var bd = document.getElementById('cs-backdrop');
  var sx, sy, lastY, lastT, vel, mode = null, dragging = false, off = 0, raf = 0, H = 1;

  function paint() {
    raf = 0;
    panel.style.transform = 'translate3d(0,' + off + 'px,0)';
    bd.style.opacity = String(Math.max(0, 1 - Math.max(0, off) / H));
  }

  panel.addEventListener('touchstart', function(e) {
    dragging = false; mode = null;
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = lastY = e.touches[0].clientY;
    lastT = Date.now(); vel = 0;
    if (e.target.closest('.sheet-head')) mode = 'head';
    else if (body.scrollTop <= 0) mode = 'body';
  }, {passive: true});

  panel.addEventListener('touchmove', function(e) {
    if (!mode) return;
    var x = e.touches[0].clientX, y = e.touches[0].clientY;
    var dx = x - sx, dy = y - sy;
    if (!dragging) {
      if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
      // verso l'alto o di lato: normale scorrimento della lista
      if (Math.abs(dx) > Math.abs(dy) || (mode === 'body' && (dy <= 0 || body.scrollTop > 0))) { mode = null; return; }
      dragging = true; sy = y; dy = 0;
      H = panel.offsetHeight || 1;
      panel.style.transition = 'none'; bd.style.transition = 'none';
    }
    if (e.cancelable) e.preventDefault();
    var now = Date.now(), dt = now - lastT;
    if (dt > 0) vel = 0.6 * ((y - lastY) / dt) + 0.4 * vel;
    lastY = y; lastT = now;
    off = dy < 0 ? dy * 0.2 : dy; // verso l'alto si muove appena (resistenza)
    if (!raf) raf = requestAnimationFrame(paint);
  }, {passive: false});

  function end() {
    if (!dragging) { mode = null; return; }
    dragging = false; mode = null;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    if (Date.now() - lastT > 100) vel = 0;
    if (off > H * 0.25 || (vel > 0.45 && off > 15)) {
      var remaining = H - off;
      var dur = 140 + 200 * (remaining / H);
      if (vel > 0.2) dur = Math.min(dur, 3.6 * remaining / vel);
      closeCatSheet(false, Math.round(Math.max(130, Math.min(340, dur))));
    } else {
      panel.style.transition = 'transform .28s cubic-bezier(.25,.9,.3,1)';
      panel.style.transform = 'translate3d(0,0,0)';
      bd.style.transition = 'opacity .28s ease'; bd.style.opacity = '';
    }
    off = 0;
  }
  panel.addEventListener('touchend', end);
  panel.addEventListener('touchcancel', end);
})();

function exportMonth(m) {
  var data=expenses.filter(function(e){ return monthKey(e.date)===m; });
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='spese_'+m+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

var exportSelection = null; // 'all', '2026-04', or 'custom'

function doExport() {
  exportSelection = null;
  // Costruisci lista mesi disponibili
  var months = [];
  for (var i = 0; i < expenses.length; i++) {
    var m = monthKey(expenses[i].date);
    if (months.indexOf(m) === -1) months.push(m);
  }
  months.sort(function(a,b){ return a < b ? 1 : -1; });
  var html = '<button class="modal-opt" onclick="selectExportOption(\'all\',this)">📋 Tutte le spese</button>';
  for (var i = 0; i < months.length; i++) {
    html += '<button class="modal-opt" onclick="selectExportOption(\'' + months[i] + '\',this)">' + monthLabel(months[i]) + '</button>';
  }
  html += '<button class="modal-opt" onclick="selectExportOption(\'custom\',this)">📅 Personalizzato…</button>';
  document.getElementById('export-month-list').innerHTML = html;
  document.getElementById('export-date-range').classList.remove('visible');
  document.getElementById('export-from').value = '';
  document.getElementById('export-to').value = '';
  document.getElementById('export-modal').classList.remove('hidden');
}

function selectExportOption(val, btn) {
  exportSelection = val;
  var opts = document.getElementById('export-month-list').querySelectorAll('.modal-opt');
  for (var i = 0; i < opts.length; i++) opts[i].classList.remove('selected');
  btn.classList.add('selected');
  if (val === 'custom') {
    document.getElementById('export-date-range').classList.add('visible');
  } else {
    document.getElementById('export-date-range').classList.remove('visible');
  }
}

function closeExportModal() {
  document.getElementById('export-modal').classList.add('hidden');
}

function confirmExport() {
  if (!exportSelection) { alert('Seleziona un periodo da esportare.'); return; }
  var data;
  var filename;
  if (exportSelection === 'all') {
    data = expenses;
    filename = 'spese_tutte_' + todayISO() + '.json';
  } else if (exportSelection === 'custom') {
    var from = document.getElementById('export-from').value;
    var to = document.getElementById('export-to').value;
    if (!from || !to) { alert('Inserisci entrambe le date.'); return; }
    if (from > to) { alert('La data iniziale deve essere prima di quella finale.'); return; }
    data = expenses.filter(function(e) { return e.date >= from && e.date <= to; });
    filename = 'spese_' + from + '_' + to + '.json';
  } else {
    data = expenses.filter(function(e) { return monthKey(e.date) === exportSelection; });
    filename = 'spese_' + exportSelection + '.json';
  }
  if (!data.length) { alert('Nessuna spesa nel periodo selezionato.'); return; }
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  closeExportModal();
}

function doImport(ev) {
  var file=ev.target.files[0]; if (!file) return;
  var r=new FileReader();
  r.onload=function(e){
    try {
      var imp=JSON.parse(e.target.result);
      if (!Array.isArray(imp)) throw new Error();
      if (!confirm('Importare '+imp.length+' spese? I '+expenses.length+' record attuali verranno sostituiti.')) return;
      if (db) {
        var delPromises=expenses.map(function(exp){
          return db.collection('expenses').doc(String(exp.id)).delete();
        });
        Promise.all(delPromises).then(function(){
          var batch=db.batch();
          imp.forEach(function(exp){
            var ref=db.collection('expenses').doc(String(exp.id));
            batch.set(ref,exp);
          });
          return batch.commit();
        }).then(function(){
          alert('Importazione completata: '+imp.length+' spese caricate.');
        }).catch(function(err){
          console.error('Import error:',err);
          alert('Errore durante l\'importazione.');
        });
      } else {
        expenses=imp; saveData();
        alert('Importazione completata: '+imp.length+' spese caricate.');
      }
    } catch(err){ alert('File JSON non valido.'); }
  };
  r.readAsText(file);
  ev.target.value='';
}

function populateSelects() {
  var fc = document.getElementById('f-cat');
  if (fc) {
    var prev = fc.value || 'Spesa';
    var html = '';
    for (var i=0;i<categories.length;i++) {
      html += '<option value="'+esc(categories[i].name)+'">'+esc(categories[i].name)+'</option>';
    }
    fc.innerHTML = html;
    if (findCat(prev)) fc.value = prev;
    else if (findCat('Spesa')) fc.value = 'Spesa';
  }
  var fp = document.getElementById('f-pay');
  if (fp) {
    var prevP = fp.value || (payments[0] && payments[0].name);
    var html2 = '';
    for (var i=0;i<payments.length;i++) {
      html2 += '<option value="'+esc(payments[i].name)+'">'+esc(payments[i].name)+'</option>';
    }
    fp.innerHTML = html2;
    if (prevP && findPay(prevP)) fp.value = prevP;
  }
}

function loadConfig() {
  try {
    var raw = localStorage.getItem(CONFIG_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.categories) && parsed.categories.length) categories = parsed.categories;
      if (parsed && Array.isArray(parsed.payments) && parsed.payments.length) payments = parsed.payments;
    }
  } catch(e) {}
  ensureAltro();
}

function saveConfig() {
  ensureAltro();
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify({categories:categories, payments:payments})); } catch(_e){}
  if (db) {
    var data = {_isConfig:true, categories:categories, payments:payments};
    db.collection('expenses').doc(CONFIG_DOC_ID).set(data).catch(function(e){
      console.error('Errore salvataggio config:', e);
    });
  }
}

function openSettings() {
  renderSettings();
  document.getElementById('settings-modal').classList.remove('hidden');
}

function closeSettings() {
  document.getElementById('settings-modal').classList.add('hidden');
  var nc = document.getElementById('new-cat-name'); if (nc) nc.value = '';
  var np = document.getElementById('new-pay-name'); if (np) np.value = '';
}

function renderSettings() {
  var catEl = document.getElementById('cat-list');
  var html = '';
  for (var i=0;i<categories.length;i++) {
    var c = categories[i];
    var locked = (c.name === 'Altro');
    html += '<div class="cat-row" style="border-top:'+(i===0?'none':'1px solid #f0ede8')+';padding:9px 0">'+
      '<div class="dot" style="background:'+c.color+'"></div>'+
      '<div class="cat-name">'+esc(c.name)+'</div>'+
      (locked ? '<span style="font-size:11px;color:#bbb">default</span>' :
        '<button class="del-btn" onclick="removeCategory(\''+jsStr(c.name)+'\')" title="Rimuovi">&times;</button>') +
    '</div>';
  }
  catEl.innerHTML = html;

  var payEl = document.getElementById('pay-list');
  html = '';
  for (var i=0;i<payments.length;i++) {
    var p = payments[i];
    var lockedP = (payments.length <= 1);
    html += '<div class="cat-row" style="border-top:'+(i===0?'none':'1px solid #f0ede8')+';padding:9px 0">'+
      '<div class="cat-name"><span class="badge" style="background:'+p.bg+';color:'+p.fg+'">'+esc(p.name)+'</span></div>'+
      (lockedP ? '<span style="font-size:11px;color:#bbb">ultimo</span>' :
        '<button class="del-btn" onclick="removePayment(\''+jsStr(p.name)+'\')" title="Rimuovi">&times;</button>') +
    '</div>';
  }
  payEl.innerHTML = html;
}

function addCategory() {
  var input = document.getElementById('new-cat-name');
  var name = input.value.trim();
  if (!name) { alert('Inserisci un nome.'); return; }
  if (name.length > 40) { alert('Nome troppo lungo (max 40 caratteri).'); return; }
  if (findCat(name)) { alert('Categoria già esistente.'); return; }
  categories.push({name:name, color:autoCatColor()});
  input.value = '';
  saveConfig();
  populateSelects();
  renderSettings();
  refreshViews();
}

function removeCategory(name) {
  if (name === 'Altro') return;
  if (!findCat(name)) return;
  var count = 0;
  for (var i=0;i<expenses.length;i++) if (expenses[i].cat === name) count++;
  var msg = 'Rimuovere la categoria "'+name+'"?';
  if (count > 0) msg += '\n\n'+count+' '+(count===1?'spesa verrà riassegnata':'spese verranno riassegnate')+' a "Altro".';
  if (!confirm(msg)) return;
  if (count > 0) reassignCategory(name, 'Altro');
  categories = categories.filter(function(c){ return c.name !== name; });
  ensureAltro();
  saveConfig();
  populateSelects();
  renderSettings();
  refreshViews();
}

function addPayment() {
  var input = document.getElementById('new-pay-name');
  var name = input.value.trim();
  if (!name) { alert('Inserisci un nome.'); return; }
  if (name.length > 30) { alert('Nome troppo lungo (max 30 caratteri).'); return; }
  if (findPay(name)) { alert('Metodo già esistente.'); return; }
  var cols = autoPayColors();
  payments.push({name:name, bg:cols.bg, fg:cols.fg});
  input.value = '';
  saveConfig();
  populateSelects();
  renderSettings();
  refreshViews();
}

function removePayment(name) {
  if (payments.length <= 1) return;
  var fallback = null;
  for (var i=0;i<payments.length;i++) {
    if (payments[i].name !== name) { fallback = payments[i].name; break; }
  }
  if (!fallback) return;
  var count = 0;
  for (var i=0;i<expenses.length;i++) if (expenses[i].pay === name) count++;
  var msg = 'Rimuovere il metodo di pagamento "'+name+'"?';
  if (count > 0) msg += '\n\n'+count+' '+(count===1?'spesa verrà riassegnata':'spese verranno riassegnate')+' a "'+fallback+'".';
  if (!confirm(msg)) return;
  if (count > 0) reassignPayment(name, fallback);
  payments = payments.filter(function(p){ return p.name !== name; });
  saveConfig();
  populateSelects();
  renderSettings();
  refreshViews();
}

function reassignCategory(oldName, newName) {
  var toUpdate = [];
  for (var i=0;i<expenses.length;i++) {
    if (expenses[i].cat === oldName) {
      expenses[i].cat = newName;
      toUpdate.push(expenses[i]);
    }
  }
  if (db && toUpdate.length) {
    var batch = db.batch();
    for (var i=0;i<toUpdate.length;i++) {
      var exp = toUpdate[i];
      batch.set(db.collection('expenses').doc(String(exp.id)), {id:exp.id, name:exp.name, amount:exp.amount, date:exp.date, cat:exp.cat, pay:exp.pay});
    }
    batch.commit().catch(function(e){ console.error('Errore riassegnazione categoria:', e); });
  } else {
    saveData();
  }
}

function reassignPayment(oldName, newName) {
  var toUpdate = [];
  for (var i=0;i<expenses.length;i++) {
    if (expenses[i].pay === oldName) {
      expenses[i].pay = newName;
      toUpdate.push(expenses[i]);
    }
  }
  if (db && toUpdate.length) {
    var batch = db.batch();
    for (var i=0;i<toUpdate.length;i++) {
      var exp = toUpdate[i];
      batch.set(db.collection('expenses').doc(String(exp.id)), {id:exp.id, name:exp.name, amount:exp.amount, date:exp.date, cat:exp.cat, pay:exp.pay});
    }
    batch.commit().catch(function(e){ console.error('Errore riassegnazione pagamento:', e); });
  } else {
    saveData();
  }
}

function refreshViews() {
  markStale();
  if (currentTab==='list') renderList();
  if (currentTab==='summary') {
    if (sumView==='month') renderSummary();
    else renderYearSummary();
  }
}

init();
</script>
